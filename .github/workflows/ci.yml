name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: unit & integration tests (no Docker, SQLite fallback)
  # ─────────────────────────────────────────────────────────────
  test:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt pytest pytest-cov

      - name: Run tests
        env:
          GOOGLE_API_KEY: dummy-key-for-tests
          GROQ_API_KEY: dummy-key-for-tests
          POSTGRES_URL: sqlite:///./test.db
        run: |
          pytest backend/tests/ -v --tb=short \
            --cov=backend/src \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # Job 2: build & smoke test the full Docker stack
  # ─────────────────────────────────────────────────────────────
  build:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Create env file
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          printf '%s\n' \
            "GOOGLE_API_KEY=${GOOGLE_API_KEY:-dummy-key}" \
            "GROQ_API_KEY=${GROQ_API_KEY:-dummy-key}" \
            "GROQ_API_URL=https://api.groq.com/openai/v1" \
            "GROQ_MODEL_TRANSCRIBER=whisper-large-v3" \
            "USE_MODEL=gemini-2.5-flash-lite" \
            "LANGUAGE=es" \
            "POSTGRES_URL=postgresql://transcriber:transcriberpass@postgres:5432/transcriberapp" \
            "REDIS_URL=redis://redis:6379" \
            "SECRET_KEY=ci-secret-key-not-for-production" \
            "FFMPEG_API_URL=http://ffmpeg-api:8080" \
            "UPLOADS_TEMP_DIR=/tmp/audios_chunks" \
            "RECORDINGS_DIR=/app/recordings" \
            > .env.prod

      - name: Setup CI Environment and Disable Deprecation Warnings
        run: |
          echo "FORCE_JAVASCRIPT_ACTIONS_TO_NODE24=true" >> $GITHUB_ENV
          docker network create oauth2server_oauth-network || true
          docker network create ffmpeg-cuda_ffmpeg-network || true
          docker network create reverse-proxy-net || true
          echo "events {} http { server { listen 80; } }" > nginx.conf
          cat <<EOF > docker-compose.override.yml
          services:
            backend:
              ports:
                - "8002:8000"
          EOF

      - name: Build Docker images
        run: docker compose -f docker-compose.yml -f docker-compose.override.yml build backend

      - name: Start services
        run: docker compose -f docker-compose.yml -f docker-compose.override.yml up -d

      - name: Wait for backend to be ready
        run: |
          echo "Waiting for backend..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8002/health; then
              echo "Backend is up"
              exit 0
            fi
            sleep 3
          done
          echo "Backend did not start in time"
          docker compose -f docker-compose.yml -f docker-compose.override.yml logs backend
          exit 1

      - name: Smoke test — health endpoint
        run: |
          response=$(curl -sf http://localhost:8002/health)
          echo "Response: $response"
          echo "$response" | grep -q '"ok"'

      - name: Smoke test — authentication check endpoint
        run: |
          response=$(curl -sf http://localhost:8002/api/auth/check)
          echo "Response: $response"
          echo "$response" | grep -qE '"logged_in"'

      - name: Print logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.override.yml logs

      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.override.yml down -v
