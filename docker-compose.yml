version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - transcriberapp-network
      - oauth2server_oauth-network
      - ffmpeg-cuda_ffmpeg-network
    env_file:
      - .env.prod
    volumes:
      - /tmp/logs:/app/logs
      - /tmp/data:/app/data
      - /tmp/audios:/app/audios
      - /tmp/audios/audios_chunks:/app/audios/audios_chunks
      - /tmp/transcripts:/app/transcripts
      - /tmp/outputs:/app/outputs
      - /tmp/outputs/metrics:/app/outputs/metrics
      - /tmp/recordings:/app/recordings
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    networks:
      - transcriberapp-network
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    networks:
      - transcriberapp-network
      - reverse-proxy-net
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/dist:/usr/share/nginx/html
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: transcriberapp
      POSTGRES_USER: transcriber
      POSTGRES_PASSWORD: transcriberpass
    networks:
      - transcriberapp-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks:
      - transcriberapp-network
    restart: unless-stopped

networks:
  transcriberapp-network:
    driver: bridge
  oauth2server_oauth-network:
    external: true
  ffmpeg-cuda_ffmpeg-network:
    external: true
    name: ffmpeg-cuda_ffmpeg-network
  reverse-proxy-net:
    external: true

volumes:
  postgres_data:
